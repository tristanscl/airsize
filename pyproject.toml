[project]
name = "airsize"
version = "0.1.0"
description = ""
authors = [
    {name = "Tristan Scuiller",email = "tscuiller3@gatech.edu"}
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy (==2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "scipy (==1.17)",
    "streamlit (>=1.64.0,<2.0.0)",
    "numdifftools (>=0.11.1,<0.12.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "stqdm (>=0.2.1,<0.3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]

[tool.poetry]
packages = [{include = "*", from = "src"}]